name = "va-freelance-freshness-cron"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# No public route. Cron Triggers fire scheduled(), which does not need one.
# Without this, wrangler publishes <name>.<subdomain>.workers.dev and the fetch()
# handler was an unauthenticated lever to fire full scrapes (metered AI/D1/
# Workers quota). fetch() is now secret-gated too — defence in depth.
workers_dev = false

# Fire every 10 minutes so the source-available -> public-visible path has five
# minutes of processing headroom inside the 15-minute freshness target. Source
# cadence guards still prevent restricted feeds from being fetched this often.
[triggers]
crons = ["*/10 * * * *"]

[vars]
SCRAPE_URL = "https://remotejobs-ph.pages.dev/api/cron/scrape"

# PROXY_SECRET is a Worker SECRET (not a var). Set it once, in this directory:
#   npx wrangler secret put PROXY_SECRET
# Use the same value as the Pages project's PROXY_SECRET.
