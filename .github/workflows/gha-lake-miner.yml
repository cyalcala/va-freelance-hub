name: Autonomous Worldwide Lake Miner (Continuous Background Discovery)

# ==============================================================================
# ROLE: Autonomous Background Worldwide Source Universe & ATS Miner
# AUTHORITY: docs/SOURCE_UNIVERSE_GLOBAL_MINER_MASTER_PROMPT.md
# CONSTITUTION: Master Operating Constitution v3.0 (Part LXII & Global Miner Overlay)
# ==============================================================================
# Continuously mines and validates candidate ATS tenants:
#   1. Stratified reconciliation of unvalidated claims from the discovered corpus.
#   2. Live domain ATS discovery from active lake inventory employers.
#   3. Deterministic geoGate + Jev 1.13 admission adjudication.
#   4. Ingestion of QUALIFIED_READY opportunities into Turso Lake reservoir.
#   5. Dual-gate publishing floor remains intact (no unauthorized D1 mutations).
# ==============================================================================

on:
  schedule:
    - cron: '23 */3 * * *' # Every 3 hours at minute 23 (smooth cadence, non-clashing)
  workflow_dispatch:
    inputs:
      reconcile_per_family:
        description: "Boards per ATS family to reconcile"
        required: false
        default: "20"
        type: string
      domain_limit:
        description: "Employer domain candidates to probe"
        required: false
        default: "25"
        type: string
      delay_ms:
        description: "Inter-probe delay in milliseconds (min 1000)"
        required: false
        default: "1500"
        type: string
      dry_run:
        description: "Dry-run mode (read-only probes, no db writes)"
        required: false
        default: false
        type: boolean

concurrency:
  group: gha-lake-miner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mine:
    name: Mine & Reconcile ATS Tenants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Autonomous Lake Miner Cycle
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TURSO_DATABASE_URL:-}" ]; then
            echo "Miner skipped: TURSO_DATABASE_URL is not configured."
            exit 0
          fi

          RECONCILE_ARG="--reconcile-per-family=${{ inputs.reconcile_per_family || '20' }}"
          DOMAIN_ARG="--domain-limit=${{ inputs.domain_limit || '25' }}"
          DELAY_ARG="--delay-ms=${{ inputs.delay_ms || '1500' }}"
          DRY_RUN_ARG="${{ inputs.dry_run == true && '--dry-run' || '' }}"

          bun run scripts/lake/run-lake-miner.ts $RECONCILE_ARG $DOMAIN_ARG $DELAY_ARG $DRY_RUN_ARG
