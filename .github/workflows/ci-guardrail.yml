name: Sovereign CI Guardrail

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize per-ref so two close pushes cannot deploy out of order. The
# migration lock on the release job also protects the manual recovery path.
concurrency:
  group: ci-guardrail-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate project-owned code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test

      - name: Build app
        run: bun run build

      - name: Run strict type check
        run: bun run typecheck

  release:
    name: Migrate and deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-d1-migrations
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build deploy artifact
        run: bun run build

      - name: Apply D1 migrations to production
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler d1 execute remoteph-jobs-db --remote --file=../../packages/db/sync_migrations.sql
          bunx wrangler d1 migrations apply remoteph-jobs-db --remote

      - name: Verify D1 full-text index integrity
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler d1 execute remoteph-jobs-db --remote --command "INSERT INTO opportunities_fts(opportunities_fts, rank) VALUES ('integrity-check', 1);"

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy apps/web/dist --project-name remotejobs-ph
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
