name: Sovereign CI Guardrail

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize per-ref so two close pushes cannot deploy out of order. The
# migration lock on the release job also protects the manual recovery path.
concurrency:
  group: ci-guardrail-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate project-owned code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production guardrails
        run: bun run audit:guardrails

      - name: Run unit tests
        run: bun run test

      - name: Build app
        run: bun run build

      - name: Run strict type check
        run: bun run typecheck

      - name: Validate Freshness Cron Worker
        run: |
          bun run --cwd workers/freshness-cron typecheck
          bun run --cwd workers/freshness-cron deploy:dry-run

  changes:
    name: Detect deployable changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.scope.outputs.deployable }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify release scope
        id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$CURRENT" | grep -qvE '(^docs/|.*\.md$)'; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Migrate and deploy production
    needs: [validate, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: production-d1-migrations
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build deploy artifact
        run: bun run build

      - name: Apply D1 migrations to production
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler@4.120.0 d1 execute DB --remote --env production --config wrangler.jsonc --file=../../packages/db/sync_migrations.sql
          bunx wrangler@4.120.0 d1 migrations apply DB --remote --env production --config wrangler.jsonc

      - name: Verify D1 source transition foundation and capture supply baseline
        id: transition_evidence
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # --file is Wrangler's bulk import path, which discards SELECT rows.
          # Read the fixed, tested SQL file into the read-only query transport.
          bunx wrangler@4.120.0 d1 execute DB --remote --env production --config wrangler.jsonc --json \
            --command="$(cat ../../scripts/ci/verify-source-transition.sql)" > ../../source-transition-evidence.json
          jq . ../../source-transition-evidence.json
          jq -e '
            type == "array" and length == 1 and
            all(.[]; .success == true and .meta.changed_db == false and .meta.rows_written == 0) and
            (.[0].results | length == 1) and
            (.[0].results[0] |
              .migration_0039_rows == 1 and .transition_table_count == 1 and
              .registry_column_count == 2 and .named_trigger_count == 18 and
              (.missing_triggers_json | fromjson | length == 0))
          ' ../../source-transition-evidence.json

      - name: Upload D1 source transition evidence
        if: ${{ always() && steps.transition_evidence.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: source-transition-evidence-${{ github.sha }}
          path: source-transition-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify D1 full-text index integrity
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler@4.120.0 d1 execute DB --remote --env production --config wrangler.jsonc --command "INSERT INTO opportunities_fts(opportunities_fts, rank) VALUES ('integrity-check', 1);"

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        run: bunx wrangler@4.120.0 pages deploy dist --project-name remotejobs-ph --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
