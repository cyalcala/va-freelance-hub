name: EX-03 Shadow Dispatch (Standby / GHA Fallback)

# ==============================================================================
# ROLE: Secondary Standby & Manual Fallback Runner
# PRIMARY RUNTIME: Google Cloud Platform (Cloud Scheduler + Cloud Run Job)
#   - Cloud Run Job:       shadow-dispatch-job (asia-southeast1)
#   - Cloud Scheduler:     shadow-dispatch-hourly (53 * * * * UTC)
#   - Authority:           docs/decisions/ADR-009-constitution-governed-cloud-runtime-migration.md
#   - Reason:              GHA sub-6-hour scheduler delivery dropped 78.9% of slots.
# ==============================================================================
# Hourly observation of live shadow rows. Does not scrape jobs onto the
# public board and does not admit or promote sources. Dispatcher cadence
# still floors each identity (Grafana Labs: 60 minutes).

on:
  schedule:
    - cron: '23 * * * *' # Secondary standby clock (GCP is primary at :53 hourly)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha-shadow-dispatch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    name: Dispatch shadow observations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
      SHADOW_DISPATCH_API_URL: "https://remotejobs-ph.pages.dev/api/cron/shadow-dispatch"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: POST shadow-dispatch
        run: |
          set -euo pipefail
          if [ -z "${PROXY_SECRET:-}" ]; then
            echo "PROXY_SECRET is required"
            exit 1
          fi
          HTTP=$(curl -sS -o dispatch.json -w "%{http_code}" -X POST "$SHADOW_DISPATCH_API_URL" \
            -H "Authorization: Bearer ${PROXY_SECRET}" \
            -H "Content-Type: application/json")
          cat dispatch.json
          echo
          echo "HTTP $HTTP"
          bun scripts/diagnostics/extract-shadow-dispatch-evidence.ts dispatch.json "$HTTP"
          test "$HTTP" = "200"
          jq . dispatch.json
          jq -e '.totalRegistryRows >= 1' dispatch.json
          bun -e 'import { assessShadowResponse } from "./workers/freshness-cron/src/shadow-response.ts"; console.log(assessShadowResponse(await Bun.file("dispatch.json").text()));'
          echo "Shadow dispatch rows=$(jq -r .totalRegistryRows dispatch.json) eligible=$(jq -r .eligible dispatch.json) dispatched=$(jq -r .dispatched dispatch.json) verdict=$(jq -r '.verdict.status // "unadjudicated"' dispatch.json)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.verdict.status // "none"' dispatch.json)" != "none" ]; then
            jq -r '.verdict.classifications[]? | "verdict: \(.sourceId) \(.outcome) -> \(.classification)"' dispatch.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shadow dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-dispatch-payload-${{ github.run_id }}
          path: dispatch.json
          if-no-files-found: ignore

