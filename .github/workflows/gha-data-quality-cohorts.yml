name: 📊 DATA-03 Quality Cohort Baseline (read-only)

# DATA-03: on-demand, source-stratified data-quality cohort snapshot.
#
# This workflow is READ-ONLY. It emits the cohort SQL from the single source of
# truth (scripts/diagnostics/data-quality-cohorts.ts), runs only SELECT / EXPLAIN
# QUERY PLAN statements against the remote production D1, gates on partition
# reconciliation, and uploads the raw JSON as an artifact. It performs no D1
# writes and no git commits — the dated evidence report is authored from the
# downloaded artifact in a reviewed docs commit.
#
# manual dispatch only (no schedule): this is a guarded diagnostic, not a new
# scheduler. Promotion to a cadence requires two proven safe runs (DATA-03
# AUTOMATION CLASS).

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "UTC snapshot instant (ISO 8601). Blank = run time."
        required: false
        default: ""

concurrency:
  group: gha-data-quality-cohorts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cohorts:
    name: Source-stratified quality cohorts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Emit cohort SQL, plans, and meta (single source of truth)
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/data03"
          AS_OF_INPUT="${{ github.event.inputs.as_of }}"
          if [ -n "${AS_OF_INPUT}" ]; then
            bun scripts/diagnostics/data-quality-cohorts.ts emit "${OUT}" --as-of "${AS_OF_INPUT}"
          else
            bun scripts/diagnostics/data-quality-cohorts.ts emit "${OUT}"
          fi
          echo "Emitted cohort bundle:"
          cat "${OUT}/cohorts-meta.json"

      - name: Run read-only cohort queries against remote D1
        working-directory: apps/web
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/data03"
          mkdir -p "${OUT}/results"
          # One single-statement --command per cohort: multi-statement --file
          # returns only an aggregate summary, so each query is run on its own to
          # get real result rows (clean JSON on stdout, same as the Medic pulse).
          for name in $(jq -r '.queryOrder[]' "${OUT}/cohorts-meta.json"); do
            echo "Running cohort: ${name}"
            bunx wrangler@4.120.0 d1 execute DB --remote --env production --config wrangler.jsonc \
              --json --command "$(cat "${OUT}/queries/${name}.sql")" > "${OUT}/results/${name}.json"
          done

      - name: Capture EXPLAIN QUERY PLAN evidence
        working-directory: apps/web
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/data03"
          mkdir -p "${OUT}/plans-results"
          for f in "${OUT}"/plans/*.sql; do
            name="$(basename "${f}" .sql)"
            echo "Explaining: ${name}"
            bunx wrangler@4.120.0 d1 execute DB --remote --env production --config wrangler.jsonc \
              --json --command "$(cat "${f}")" > "${OUT}/plans-results/${name}.json"
          done

      - name: Collect and reconcile partitions (fails the run on any non-zero delta)
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/data03"
          bun scripts/diagnostics/data-quality-cohorts.ts collect \
            "${OUT}/results" "${OUT}/cohorts-meta.json" "${OUT}/cohorts-collected.json"

      - name: Upload cohort artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data03-quality-cohorts
          path: |
            ${{ runner.temp }}/data03/cohorts.sql
            ${{ runner.temp }}/data03/cohorts-plans.sql
            ${{ runner.temp }}/data03/cohorts-meta.json
            ${{ runner.temp }}/data03/cohorts-collected.json
            ${{ runner.temp }}/data03/results/
            ${{ runner.temp }}/data03/plans-results/
          if-no-files-found: warn

      - name: 📊 Cohort summary
        if: always()
        continue-on-error: true
        run: |
          OUT="${RUNNER_TEMP}/data03"
          {
            echo "### 📊 DATA-03 Quality Cohort Baseline"
            echo ""
            if [ -f "${OUT}/cohorts-meta.json" ]; then
              echo "**Cutoffs**"
              echo '```json'
              cat "${OUT}/cohorts-meta.json"
              echo '```'
            fi
            if [ -f "${OUT}/cohorts-collected.json" ]; then
              echo ""
              echo "**Reconciliation**"
              echo '```json'
              jq '.reconciliation' "${OUT}/cohorts-collected.json"
              echo '```'
            fi
            echo ""
            echo "Download the \`data03-quality-cohorts\` artifact for collected results, plans, and the emitted SQL."
          } >> "$GITHUB_STEP_SUMMARY"
