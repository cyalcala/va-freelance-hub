name: Sovereign Chef Pulse

on:
  workflow_dispatch: 

concurrency:
  group: gha-chef-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cook:
    name: Execute AI Transcript Digest (Chef)
    runs-on: ubuntu-latest
    timeout-minutes: 25 
    env:
      PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
      INGEST_DIGEST_API_URL: "https://remotejobs-ph.pages.dev/api/ingest-digest"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    
    steps:
      - name: 🛑 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🥟 Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 👨‍🍳 Deploy the Chef
        run: |
          # Keep the human-readable log, but do not turn a failed Chef run into
          # a green workflow because tee is the final command in the pipeline.
          set -o pipefail
          set +e
          bun run scripts/gha/chef.ts 2>&1 | tee chef.log
          CHEF_EXIT=${PIPESTATUS[0]}
          set -e

          # Extract stats for summary
          PLATED=$(grep -c '\[PLATED\]' chef.log || true)
          FAILED=$(grep -c '\[CHEF\] Burnt dish' chef.log || true)
          echo "PLATED=$PLATED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          exit "$CHEF_EXIT"

      - name: 📊 Generate Chef Summary
        if: always()
        run: |
          set -euo pipefail
          echo "### 👨‍🍳 Sovereign Chef Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dishes Plated**: $PLATED" >> $GITHUB_STEP_SUMMARY
          echo "- **Dishes Burnt**: $FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
