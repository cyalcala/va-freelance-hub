name: Automatic Lake Publish

# Publishes qualified lake rows that already cleared the mathematical gate.
# No human approval step. Missing credentials skip the job instead of failing closed
# into a red cron; the kill switch is `lake:sync --hold-auto-approved`.

on:
  schedule:
    - cron: '47 * * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: "Probe up to 25 employer domains before publishing"
        required: false
        default: false
        type: boolean

concurrency:
  group: gha-lake-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish qualified lake rows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Discover a bounded cohort
        if: github.event.schedule == '17 4 * * *' || inputs.discover == true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TURSO_DATABASE_URL:-}" ]; then
            echo "Discovery skipped: TURSO_DATABASE_URL is not configured."
            exit 0
          fi
          bun run scripts/lake/domain-ats-discovery.ts --limit=25

      - name: Publish qualified rows
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TURSO_DATABASE_URL:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Publish skipped: lake or Cloudflare credentials are not configured on this runner."
            exit 0
          fi
          bun run lake:sync
