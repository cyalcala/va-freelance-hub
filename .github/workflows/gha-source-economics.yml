name: APEX source economics

on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: apex-source-economics
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Emit and execute tested read-only queries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/economics"
          bun scripts/diagnostics/source-economics.ts emit "$OUT"
          mkdir -p "$OUT/results"
          for name in $(jq -r '.queryOrder[]' "$OUT/economics-meta.json"); do
            bunx wrangler d1 execute DB --remote --env production --config apps/web/wrangler.jsonc --json \
              --command "$(cat "$OUT/queries/$name.sql")" > "$OUT/results/$name.json"
            jq -e 'all(.[]; .success == true and .meta.rows_written == 0 and .meta.changed_db == false)' "$OUT/results/$name.json"
          done
          bun scripts/diagnostics/source-economics.ts collect "$OUT/results" "$OUT/economics-meta.json" "$OUT/combined.json"
          bun scripts/diagnostics/source-economics.ts report "$OUT/combined.json" > docs/source-economics-latest.md
          cat docs/source-economics-latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: source-economics-${{ github.run_id }}
          path: ${{ runner.temp }}/economics
          retention-days: 90
      - name: Back up aggregate report
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/source-economics-latest.md
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'docs: update measured source economics [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
