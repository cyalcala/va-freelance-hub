name: APEX source economics

on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: apex-source-economics
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Emit and execute tested read-only queries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/economics"
          bun scripts/diagnostics/source-economics.ts emit "$OUT"
          mkdir -p "$OUT/results"
          for name in $(jq -r '.queryOrder[]' "$OUT/economics-meta.json"); do
            bunx wrangler@4.143.0 d1 execute DB --remote --env production --config apps/web/wrangler.jsonc --json \
              --command "$(cat "$OUT/queries/$name.sql")" > "$OUT/results/$name.json"
            jq -e 'all(.[]; .success == true and .meta.rows_written == 0 and .meta.changed_db == false)' "$OUT/results/$name.json"
          done
          bun scripts/diagnostics/source-economics.ts collect "$OUT/results" "$OUT/economics-meta.json" "$OUT/combined.json"
          bun scripts/diagnostics/source-economics.ts report "$OUT/combined.json" > docs/source-economics-latest.md
          cat docs/source-economics-latest.md >> "$GITHUB_STEP_SUMMARY"
          bun scripts/diagnostics/economics-snapshot.ts snapshot "$OUT/combined.json" docs/economics-snapshots --run-id "$GITHUB_RUN_ID"
          bun scripts/diagnostics/economics-snapshot.ts check docs/economics-snapshots >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: source-economics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/economics
            docs/economics-snapshots
          retention-days: 90
      - name: Prune retained aggregate snapshots
        if: github.ref == 'refs/heads/main'
        run: bun scripts/diagnostics/economics-snapshot.ts prune docs/economics-snapshots
      - name: Persist generated report in canonical SSM
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/persist-generated-report
        with:
          report-key: economics
          gcp-credentials-json: ${{ secrets.GCP_SA_KEY }}
