name: Sovereign Database Pruning

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: gha-prune-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: Execute duplicate pruning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger prune API
        run: |
          set -euo pipefail
          RESPONSE=$(curl --silent --show-error --connect-timeout 20 --max-time 120 -w "\n%{http_code}" -X POST "https://remotejobs-ph.pages.dev/api/cron/prune" \
            -H "Authorization: Bearer ${{ secrets.PROXY_SECRET }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')

          printf 'Response Code: %s\n' "$HTTP_CODE"
          printf 'Response Body: %s\n' "$BODY"
          echo "PRUNE_HTTP_CODE=$HTTP_CODE" >> $GITHUB_ENV

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Pruning failed with status $HTTP_CODE"
            exit 1
          fi

          printf '%s' "$BODY" | jq -e 'if type == "object" then . else error("expected JSON object") end' > prune-response.json
          ARCHIVED_HASH=$(jq -er '.archivedHashDuplicates // 0 | if type == "number" then . else error("archivedHashDuplicates must be a number") end' prune-response.json)
          PRUNE_MODE=$(jq -er '.mode | if type == "string" then . else error("mode must be a string") end' prune-response.json)

          echo "ARCHIVED_HASH=$ARCHIVED_HASH" >> $GITHUB_ENV
          echo "PRUNE_MODE=$PRUNE_MODE" >> $GITHUB_ENV

          if [ "$PRUNE_MODE" != "soft-archive" ]; then
            echo "::warning::Prune endpoint did not report soft-archive mode (got: $PRUNE_MODE). Verify no hard deletes are happening."
          fi

      - name: Generate prune summary
        if: always()
        continue-on-error: true
        run: |
          echo "### Sovereign Database Pruning Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API HTTP status**: ${PRUNE_HTTP_CODE:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${PRUNE_MODE:-not received} (rows archived, never deleted)" >> $GITHUB_STEP_SUMMARY
          echo "- **Duplicate Active Rows Archived (Hash+Company)**: ${ARCHIVED_HASH:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
