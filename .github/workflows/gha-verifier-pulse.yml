name: Sovereign Verifier Pulse

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: gha-verifier-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Execute link and age audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
      VERIFY_API_URL: "https://remotejobs-ph.pages.dev/api/cron/verify-links"
    steps:
      - name: Execute link verification API
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error --connect-timeout 20 --max-time 120 -w "%{http_code}" -o verify.log -X POST "$VERIFY_API_URL" \
            -H "Authorization: Bearer $PROXY_SECRET" \
            -H "x-cron-secret: $PROXY_SECRET" \
            -H "Content-Type: application/json")

          echo "HTTP Status: $HTTP_CODE"
          cat verify.log
          echo ""

          # Fail on any non-2xx, including curl connection failures ("000").
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Verify API returned HTTP $HTTP_CODE"
            exit 1
          fi

          jq -e 'if type == "object" then . else error("expected JSON object") end' verify.log > /dev/null
          ATTEMPTED=$(jq -er '.attempted | if type == "number" then . else error("attempted must be a number") end' verify.log)
          SUCCEEDED=$(jq -er '.succeeded | if type == "number" then . else error("succeeded must be a number") end' verify.log)
          FAILED_CHECKS=$(jq -er '.failedChecks | if type == "number" then . else error("failedChecks must be a number") end' verify.log)
          BUDGET=$(jq -er '.budget | if type == "number" then . else error("budget must be a number") end' verify.log)
          EXTERNAL_FETCH_BUDGET=$(jq -er '.externalFetchBudget | if type == "number" then . else error("externalFetchBudget must be a number") end' verify.log)
          MAX_REDIRECT_HOPS=$(jq -er '.maxRedirectHops | if type == "number" then . else error("maxRedirectHops must be a number") end' verify.log)
          DEFERRED=$(jq -er '.deferred | if type == "number" then . else error("deferred must be a number") end' verify.log)
          BACKLOG=$(jq -er '.verificationBacklog | if type == "number" then . else error("verificationBacklog must be a number") end' verify.log)
          SWEEP_DAYS=$(jq -er '.estimatedSweepDays | if type == "number" then . else error("estimatedSweepDays must be a number") end' verify.log)
          PLATFORM_BUDGET_FAILURES=$(jq -er '.platformBudgetFailures | if type == "number" then . else error("platformBudgetFailures must be a number") end' verify.log)
          ARCHIVED=$(jq -er '.autoArchived // 0 | if type == "number" then . else error("autoArchived must be a number") end' verify.log)
          DEACTIVATED=$(jq -er '.deactivated // 0 | if type == "number" then . else error("deactivated must be a number") end' verify.log)
          NEVER_VERIFIED=$(jq -er '.neverVerifiedRemaining // 0 | if type == "number" then . else error("neverVerifiedRemaining must be a number") end' verify.log)

          echo "VERIFY_HTTP_CODE=$HTTP_CODE" >> $GITHUB_ENV
          echo "VERIFY_ATTEMPTED=$ATTEMPTED" >> $GITHUB_ENV
          echo "VERIFY_SUCCEEDED=$SUCCEEDED" >> $GITHUB_ENV
          echo "VERIFY_FAILED_CHECKS=$FAILED_CHECKS" >> $GITHUB_ENV
          echo "VERIFY_BUDGET=$BUDGET" >> $GITHUB_ENV
          echo "VERIFY_EXTERNAL_FETCH_BUDGET=$EXTERNAL_FETCH_BUDGET" >> $GITHUB_ENV
          echo "VERIFY_MAX_REDIRECT_HOPS=$MAX_REDIRECT_HOPS" >> $GITHUB_ENV
          echo "VERIFY_DEFERRED=$DEFERRED" >> $GITHUB_ENV
          echo "VERIFY_BACKLOG=$BACKLOG" >> $GITHUB_ENV
          echo "VERIFY_SWEEP_DAYS=$SWEEP_DAYS" >> $GITHUB_ENV
          echo "VERIFY_PLATFORM_BUDGET_FAILURES=$PLATFORM_BUDGET_FAILURES" >> $GITHUB_ENV
          echo "VERIFY_ARCHIVED=$ARCHIVED" >> $GITHUB_ENV
          echo "VERIFY_DEACTIVATED=$DEACTIVATED" >> $GITHUB_ENV
          echo "VERIFY_NEVER_VERIFIED=$NEVER_VERIFIED" >> $GITHUB_ENV

      - name: Generate verifier summary
        if: always()
        continue-on-error: true
        run: |
          echo "### Sovereign Verifier Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API HTTP status**: ${VERIFY_HTTP_CODE:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Links Attempted**: ${VERIFY_ATTEMPTED:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Safe Item Budget**: ${VERIFY_BUDGET:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Worst-Case External Fetches**: ${VERIFY_EXTERNAL_FETCH_BUDGET:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Maximum Redirect Hops Per Item**: ${VERIFY_MAX_REDIRECT_HOPS:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Checks Deferred This Run**: ${VERIFY_DEFERRED:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Active Verification Backlog**: ${VERIFY_BACKLOG:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Estimated Full Sweep**: ${VERIFY_SWEEP_DAYS:-not received} days at two runs/day" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform-Budget Failures**: ${VERIFY_PLATFORM_BUDGET_FAILURES:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Checks Succeeded**: ${VERIFY_SUCCEEDED:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Checks Failed**: ${VERIFY_FAILED_CHECKS:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dead Links Pruned**: ${VERIFY_DEACTIVATED:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Stale Jobs Archived (>30d)**: ${VERIFY_ARCHIVED:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Never-Verified Backlog Remaining**: ${VERIFY_NEVER_VERIFIED:-not received}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY

          if [[ "${VERIFY_NEVER_VERIFIED:-}" =~ ^[0-9]+$ ]] && [ "$VERIFY_NEVER_VERIFIED" -gt 300 ]; then
            echo "::warning title=Verification backlog growing::$VERIFY_NEVER_VERIFIED active jobs have never been link-verified. Review sweep architecture without exceeding the safe per-run budget."
          fi

      - name: Enforce systemic verifier failure gate
        run: |
          if [ "${VERIFY_ATTEMPTED:-0}" -gt "${VERIFY_BUDGET:-0}" ]; then
            echo "::error title=Verifier budget exceeded::$VERIFY_ATTEMPTED attempts exceeded the declared safe budget of $VERIFY_BUDGET."
            exit 1
          fi
          if [ "${VERIFY_PLATFORM_BUDGET_FAILURES:-0}" -gt 0 ]; then
            echo "::error title=Cloudflare subrequest budget exhausted::$VERIFY_PLATFORM_BUDGET_FAILURES checks failed at the platform budget boundary."
            exit 1
          fi
          if [ "${VERIFY_ATTEMPTED:-0}" -ge 10 ] && [ $(( VERIFY_FAILED_CHECKS * 100 / VERIFY_ATTEMPTED )) -ge 80 ]; then
            echo "::error title=Verifier egress degraded::$VERIFY_FAILED_CHECKS of $VERIFY_ATTEMPTED checks failed; rows were rotated without changing strikes or visibility."
            exit 1
          fi
