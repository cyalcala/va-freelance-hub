name: Sync Secrets to GCP Secret Manager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync Secrets to GCP Secret Manager
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync Secrets into Google Secret Manager
        env:
          PROJECT_ID: antigravity-494415
          SA_EMAIL: va-hub-scheduler-invoker@antigravity-494415.iam.gserviceaccount.com
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          set -euo pipefail

          ensure_secret() {
            local secret_name="$1"
            local secret_value="$2"

            if [ -z "$secret_value" ]; then
              echo "Skipping $secret_name (empty value)"
              return 0
            fi

            if ! gcloud secrets describe "$secret_name" --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Creating secret $secret_name in Secret Manager..."
              echo -n "$secret_value" | gcloud secrets create "$secret_name" \
                --data-file=- \
                --replication-policy="automatic" \
                --project="$PROJECT_ID"
            else
              echo "Updating secret $secret_name version..."
              echo -n "$secret_value" | gcloud secrets versions add "$secret_name" \
                --data-file=- \
                --project="$PROJECT_ID"
            fi

            gcloud secrets add-iam-policy-binding "$secret_name" \
              --member="serviceAccount:${SA_EMAIL}" \
              --role="roles/secretmanager.secretAccessor" \
              --project="$PROJECT_ID" >/dev/null 2>&1 || true

            echo "✓ Secret $secret_name synchronized and bound to $SA_EMAIL"
          }

          ensure_secret "va-hub-turso-database-url" "$TURSO_DATABASE_URL"
          ensure_secret "va-hub-turso-auth-token" "$TURSO_AUTH_TOKEN"
          ensure_secret "va-hub-cloudflare-api-token" "$CLOUDFLARE_API_TOKEN"
          ensure_secret "va-hub-cloudflare-account-id" "$CLOUDFLARE_ACCOUNT_ID"
          ensure_secret "va-hub-proxy-secret" "$PROXY_SECRET"

          echo "All secrets successfully provisioned into GCP Secret Manager."
