name: Sync Secrets to GCP Secret Manager

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform (verify-ssm never synchronizes secrets or writes refs)
        type: choice
        required: true
        default: sync-secrets
        options:
          - sync-secrets
          - verify-ssm

permissions:
  contents: read

jobs:
  sync-secrets:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == '' || inputs.operation == 'sync-secrets') }}
    name: Sync Secrets to GCP Secret Manager
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync Secrets into Google Secret Manager
        env:
          PROJECT_ID: antigravity-494415
          SA_EMAIL: va-hub-scheduler-invoker@antigravity-494415.iam.gserviceaccount.com
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          set -euo pipefail

          ensure_secret() {
            local secret_name="$1"
            local secret_value="$2"

            if [ -z "$secret_value" ]; then
              echo "Skipping $secret_name (empty value)"
              return 0
            fi

            if ! gcloud secrets describe "$secret_name" --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Creating secret $secret_name in Secret Manager..."
              echo -n "$secret_value" | gcloud secrets create "$secret_name" \
                --data-file=- \
                --replication-policy="automatic" \
                --project="$PROJECT_ID"
            else
              echo "Updating secret $secret_name version..."
              echo -n "$secret_value" | gcloud secrets versions add "$secret_name" \
                --data-file=- \
                --project="$PROJECT_ID"
            fi

            gcloud secrets add-iam-policy-binding "$secret_name" \
              --member="serviceAccount:${SA_EMAIL}" \
              --role="roles/secretmanager.secretAccessor" \
              --project="$PROJECT_ID" >/dev/null 2>&1 || true

            echo "✓ Secret $secret_name synchronized and bound to $SA_EMAIL"
          }

          ensure_secret "va-hub-turso-database-url" "$TURSO_DATABASE_URL"
          ensure_secret "va-hub-turso-auth-token" "$TURSO_AUTH_TOKEN"
          ensure_secret "va-hub-cloudflare-api-token" "$CLOUDFLARE_API_TOKEN"
          ensure_secret "va-hub-cloudflare-account-id" "$CLOUDFLARE_ACCOUNT_ID"
          ensure_secret "va-hub-proxy-secret" "$PROXY_SECRET"

          echo "All secrets successfully provisioned into GCP Secret Manager."

  verify-ssm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-ssm' }}
    name: Verify SSM capability without writing refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate existing GCP identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: antigravity-494415
          create_credentials_file: true
          cleanup_credentials: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 395.0.0'

      - name: Probe canonical SSM read and dry-run push
        shell: bash
        env:
          # Fixed canonical origin; no caller-supplied repository or ref.
          CANONICAL_SSM_URL: https://va-freelance-hub-296059249147-git.asia-northeast1.sourcemanager.dev/antigravity-494415/va-freelance-hub.git
          GIT_TERMINAL_PROMPT: '0'
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo '::error::Numeric GitHub run identity is required for the diagnostic ref.'
            exit 1
          fi
          probe_ref="refs/heads/codex/diagnostics/ssm-capability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Use only the existing GCP identity, scoped to the canonical host.
          # No persistent Git configuration, credential store or token output.
          git_auth=(-c credential.helper= -c credential.https://va-freelance-hub-296059249147-git.asia-northeast1.sourcemanager.dev.helper=gcloud.sh)
          git_network=(-c http.lowSpeedLimit=1 -c http.lowSpeedTime=30)

          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          git "${git_auth[@]}" "${git_network[@]}" ls-remote --heads --tags "$CANONICAL_SSM_URL"
          git "${git_auth[@]}" "${git_network[@]}" push --dry-run --porcelain --no-follow-tags "$CANONICAL_SSM_URL" "HEAD:$probe_ref"

          {
            echo '### SSM capability probe passed'
            echo 'Canonical refs were readable and dry-run receive-pack negotiation passed.'
            printf 'Diagnostic target: `%s` (no ref written).\n' "$probe_ref"
            echo 'This probe is not persisted-write, protected-branch, or mirror-continuity proof.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral auth file
        if: ${{ always() }}
        shell: bash
        env:
          AUTH_FILE: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [[ -n "$AUTH_FILE" ]]; then
            case "$AUTH_FILE" in
              "$GITHUB_WORKSPACE"/gha-creds-*.json) rm -f -- "$AUTH_FILE" ;;
              *) echo '::error::Refusing cleanup outside the generated auth-file path.'; exit 1 ;;
            esac
          fi
